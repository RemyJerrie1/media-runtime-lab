services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: media
      POSTGRES_PASSWORD: media
      POSTGRES_DB: media_runtime
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media -d media_runtime"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - media-runtime-data:/var/lib/postgresql/data
volumes:
  media-runtime-data: