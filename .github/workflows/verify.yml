name: verify
on:
  push:
    branches: [dev]
  pull_request:
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recovery:
    # Keep visual baselines on the same OS used to review them. Both engines are required.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with: { version: 11.16.0 }
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium webkit
      - run: pnpm exec turbo build --filter=@media-lab/web
      - run: pnpm test:recovery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-browser-evidence
          path: |
            .runtime/recovery-report
            .runtime/recovery-results
          retention-days: 7
          include-hidden-files: true
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: media
          POSTGRES_PASSWORD: media
          POSTGRES_DB: media_runtime
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U media -d media_runtime"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://media:media@localhost:5432/media_runtime
      MEDIA_RUNTIME_API_KEY: ci-test-key
      NODE_ENV: test
      FFMPEG_BINARY: /usr/bin/ffmpeg
      FFPROBE_BINARY: /usr/bin/ffprobe
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with: { version: 11.16.0 }
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Install media runtime with text rendering
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg fonts-dejavu-core
      - name: Verify media runtime capabilities
        run: |
          "$FFMPEG_BINARY" -hide_banner -filters > /tmp/media-runtime-filters.txt
          grep -w drawtext /tmp/media-runtime-filters.txt
          grep -w subtitles /tmp/media-runtime-filters.txt
          "$FFPROBE_BINARY" -version
      - run: pnpm governance
      - run: pnpm typecheck
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm build
      - run: pnpm benchmark:verify
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-evidence
          path: |
            .runtime/playwright-report
            .runtime/playwright-results
          retention-days: 7
          include-hidden-files: true
      - run: pnpm audit --audit-level high
